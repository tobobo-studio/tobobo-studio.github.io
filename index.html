<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>제곱을 만들어보자!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Fredoka:wght@600;700&family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#17171C;
  --grey50:#202027; --grey100:#2C2C35; --grey500:#9E9EA4; --grey700:#C3C3C6; --grey900:#FFFFFF;
  --blue:#3182F6; --blue-press:#1B64DA; --blue50:#1F2A3D; --line:#F4EFE6;
  --coral:#F26B4F; --yellow:#FFC23D; --sage:#8DB58A; --sky:#9CC2EE; --peach:#FFB8A3; --ink:#2B2F36;
  --bs:min(30vw, 15vh, 124px);
  color-scheme: dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#17171C; --grey50:#202027; --grey100:#2C2C35; --grey500:#9E9EA4; --grey700:#C3C3C6; --grey900:#FFFFFF; --blue50:#1F2A3D; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#17171C; --grey50:#202027; --grey100:#2C2C35; --grey500:#9E9EA4; --grey700:#C3C3C6; --grey900:#FFFFFF; --blue50:#1F2A3D; color-scheme:dark; }
html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:border-box; }
body{
  margin:0; height:100%; background:var(--bg); color:var(--grey900);
  font-family:"Jua", "Toss Product Sans", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  font-synthesis:none;
  -webkit-font-smoothing:antialiased; letter-spacing:-0.02em; overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
.app{ position:relative; height:100%; max-width:480px; margin:0 auto; overflow:hidden; }

/* geometric shapes */
.shapes{ position:absolute; inset:0; pointer-events:none; z-index:0; }
.shape{ position:absolute; display:block; will-change:transform; overflow:visible; }
.shape .ol *{ fill:none !important; stroke:var(--line) !important; stroke-width:3px !important; stroke-linejoin:round; stroke-linecap:round; }

/* main */
main{ position:relative; z-index:1; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 20px 40px; }
.bubble{
  position:relative; background:var(--grey100); border-radius:24px; padding:16px 24px 18px; text-align:center; min-width:220px;
}
.bubble::after{
  content:""; position:absolute; left:50%; bottom:-10px; width:22px; height:22px; background:var(--grey100);
  border-radius:4px; transform:translateX(-50%) rotate(45deg);
}
.bubble.wiggle{ animation:wig .45s cubic-bezier(.3,1.6,.5,1); }
@keyframes wig{ 0%{transform:scale(.9);} 60%{transform:scale(1.04);} 100%{transform:none;} }
.pow{ font-size:15px; font-weight:700; color:var(--blue); }
.msg{ font-size:20px; font-weight:800; margin-top:4px; color:var(--grey900); word-break:keep-all; }
.bubble{ max-width:min(88vw, 360px); }
.board{
  position:relative; margin-top:24px; width:min(80vw, 38vh, 340px); aspect-ratio:1;
  background:radial-gradient(circle at 50% 45%, #34343D, #202027 72%); border-radius:22px; box-shadow:inset 0 0 0 2px rgba(255,255,255,.06);
}
.board canvas{ position:absolute; inset:0; width:100%; height:100%; border-radius:22px; }

.btnwrap{ position:relative; margin-top:28px; width:var(--bs); height:var(--bs); animation:boing 2.2s ease-in-out infinite; }
@keyframes boing{ 0%,58%,100%{transform:none;} 68%{transform:scale(1.07,.93);} 78%{transform:translateY(-8px) scale(.95,1.06);} 88%{transform:scale(1.03,.97);} }
@media (prefers-reduced-motion: reduce){ .btnwrap{ animation:none; } }
#btn{
  position:relative; z-index:2; width:100%; height:100%; border-radius:50%; border:0; padding:0; cursor:pointer;
  background:radial-gradient(circle at 35% 28%, #9CC8FF 0%, #5A9DFF 36%, #3182F6 68%, #2468D8 100%);
  color:#fff; font:inherit; touch-action:manipulation; user-select:none; -webkit-user-select:none;
  box-shadow:0 10px 0 #1A4FAE, 0 20px 36px rgba(49,130,246,.45), inset 0 -12px 20px rgba(10,40,120,.35), inset 0 6px 12px rgba(255,255,255,.35);
  transition:transform .12s ease, box-shadow .12s ease;
}
#btn::before{ content:""; position:absolute; left:17%; top:9%; width:38%; height:20%; border-radius:50%; background:rgba(255,255,255,.55); transform:rotate(-26deg); filter:blur(1px); pointer-events:none; }
#btn::after{ content:""; position:absolute; left:60%; top:13%; width:8%; height:8%; border-radius:50%; background:rgba(255,255,255,.75); pointer-events:none; }
#btn:active{ transform:translateY(8px) scale(1.05,.92); box-shadow:0 2px 0 #1A4FAE, 0 6px 14px rgba(49,130,246,.4), inset 0 -8px 16px rgba(10,40,120,.35), inset 0 6px 12px rgba(255,255,255,.35); }
#btn:focus-visible{ outline:3px solid var(--blue); outline-offset:6px; }
#num{ position:relative; z-index:1; display:block; font-family:"Fredoka", "Noto Sans KR", sans-serif; font-weight:700; font-size:calc(var(--bs) * .48); line-height:1; letter-spacing:0; text-shadow:0 4px 0 rgba(20,60,150,.45); }
#num sup{ display:inline-block; font-size:.52em; line-height:0; vertical-align:0; position:relative; top:-.62em; margin-left:.04em; color:#FFE07A; }
#btn.pop #num sup{ animation:supup .55s cubic-bezier(.2,1.9,.4,1); }
@keyframes supup{ 0%{ transform:translateY(70%) scale(.4); } 100%{ transform:none; } }
#btn.pop #num{ animation:numpop .45s cubic-bezier(.2,1.8,.4,1); }
@keyframes numpop{ 0%{transform:scale(.5) translateY(10%); opacity:.2;} 100%{transform:none; opacity:1;} }
#btn.squish{ animation:squish .45s cubic-bezier(.3,1.7,.5,1); }
@keyframes squish{ 0%{transform:scale(1.12,.88);} 40%{transform:scale(.94,1.06);} 100%{transform:none;} }
#btn.glow{ animation:glow 1s ease-in-out infinite alternate; }
@keyframes glow{ from{ box-shadow:0 10px 0 #1A4FAE, 0 20px 36px rgba(49,130,246,.45), inset 0 -12px 20px rgba(10,40,120,.35), inset 0 6px 12px rgba(255,255,255,.35), 0 0 0 0 rgba(49,130,246,.3);} to{ box-shadow:0 10px 0 #1A4FAE, 0 20px 36px rgba(49,130,246,.45), inset 0 -12px 20px rgba(10,40,120,.35), inset 0 6px 12px rgba(255,255,255,.35), 0 0 0 22px rgba(49,130,246,.2);} }
.ring{ position:absolute; inset:0; border-radius:50%; border:3px solid var(--blue); z-index:1; pointer-events:none; animation:ring .7s ease-out forwards; }
@keyframes ring{ from{ transform:scale(1); opacity:.7;} to{ transform:scale(1.8); opacity:0;} }
.floaty{ position:absolute; left:50%; top:50%; z-index:3; pointer-events:none; animation:floaty 1.1s ease-out forwards; }
@keyframes floaty{ from{ transform:translate(-50%,-50%) scale(.3);} to{ transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1) rotate(var(--r)); opacity:0;} }

#fx{ position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:30; }
#flash{ position:fixed; inset:0; pointer-events:none; z-index:0; opacity:0; }
#flash.go{ animation:flash .5s ease-out; }
@keyframes flash{ from{ opacity:.35;} to{ opacity:0;} }
.shake{ animation:shake .4s; }
.shake-big{ animation:shake .55s 2; }
@keyframes shake{ 0%,100%{transform:none;} 20%{transform:translate(-6px,3px);} 40%{transform:translate(5px,-4px);} 60%{transform:translate(-4px,2px);} 80%{transform:translate(3px,-2px);} }

/* finale */
.finale{
  position:fixed; inset:0; z-index:25; background:var(--bg);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
  padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));
  opacity:0; pointer-events:none; transition:opacity .5s;
}
.finale.show{ opacity:1; pointer-events:auto; }
.f-sub{ font-size:16px; font-weight:700; color:var(--blue); opacity:0; transform:translateY(8px); transition:.5s; }
.f-title{ margin:0; font-size:clamp(28px, 8.4vw, 36px); font-weight:800; line-height:1.25; text-align:center; opacity:0; transform:scale(.8); transition:.6s cubic-bezier(.3,1.6,.5,1); }
.finale.s1 .f-sub, .finale.s1 .f-title{ opacity:1; transform:none; }

.photos{ position:relative; width:min(86vw, 360px); height:min(50vh, 430px); }
.photo{
  position:absolute; margin:0; background:#fff; padding:7px; border-radius:20px;
  box-shadow:0 10px 30px rgba(0,20,60,.18); opacity:0; transition:transform .6s cubic-bezier(.3,1.5,.5,1), opacity .3s;
}
.photo img{ display:block; width:100%; height:100%; object-fit:cover; border-radius:14px; }
.p3{ left:13%; top:15%; width:74%; aspect-ratio:1; z-index:1; transform:scale(.4); }
.p1{ left:-4%; bottom:2%; width:54%; aspect-ratio:4/3; z-index:2; transform:translateX(-70px) rotate(-22deg) scale(.6); }
.p2{ right:-4%; top:0; width:42%; aspect-ratio:1; z-index:3; transform:translateX(70px) rotate(22deg) scale(.6); }
.finale.s2 .p3{ opacity:1; transform:rotate(-2deg); }
.finale.s3 .p1{ opacity:1; transform:rotate(-7deg); }
.finale.s4 .p2{ opacity:1; transform:rotate(8deg); }
.say{
  position:absolute; z-index:5; background:#fff; color:#191F28; font-size:15px; font-weight:800; line-height:1.35;
  padding:9px 13px; border-radius:16px; box-shadow:0 6px 18px rgba(0,20,60,.2); width:max-content; max-width:200px;
  opacity:0; transform:scale(.4); transition:opacity .3s .4s, transform .45s cubic-bezier(.3,1.7,.5,1) .4s;
}
.say::after{ content:""; position:absolute; left:24px; width:14px; height:14px; background:#fff; border-radius:2px; transform:rotate(45deg); }
.say.up::after{ bottom:-6px; }
.say.down::after{ top:-6px; }
.b3{ left:-10px; top:-30px; transform-origin:20% 100%; }
.b1{ left:8px; top:-54px; transform-origin:20% 100%; }
.b2{ right:-4px; bottom:-52px; transform-origin:80% 0; }
.b2::after{ left:auto; right:24px; }
.finale.s2 .b3, .finale.s3 .b1, .finale.s4 .b2{ opacity:1; transform:none; }
@keyframes rattle{
  0%{ translate:0 0; rotate:0deg; scale:1; }
  10%{ translate:-7px 4px; rotate:-6deg; scale:1.04; }
  20%{ translate:8px -5px; rotate:7deg; scale:.97; }
  30%{ translate:-8px 2px; rotate:-5deg; scale:1.05; }
  40%{ translate:6px 6px; rotate:6deg; scale:.98; }
  50%{ translate:-4px -7px; rotate:-7deg; scale:1.04; }
  60%{ translate:8px 2px; rotate:5deg; scale:.97; }
  70%{ translate:-7px 5px; rotate:-6deg; scale:1.05; }
  80%{ translate:4px -4px; rotate:7deg; scale:.98; }
  90%{ translate:-5px 3px; rotate:-4deg; scale:1.03; }
  100%{ translate:0 0; rotate:0deg; scale:1; }
}
@keyframes rattle-text{
  0%,100%{ translate:0 0; rotate:0deg; }
  25%{ translate:-3px 2px; rotate:-4deg; }
  50%{ translate:3px -2px; rotate:4deg; }
  75%{ translate:-2px -1px; rotate:-3deg; }
}
.finale.s2 .p3{ animation:rattle 2s ease-in-out .6s infinite; }
.finale.s3 .p1{ animation:rattle 1.7s ease-in-out .6s infinite; }
.finale.s4 .p2{ animation:rattle .28s linear .6s infinite; }
.finale.s2 .b3, .finale.s3 .b1, .finale.s4 .b2{ animation:rattle-text .22s linear .8s infinite; }
.finale.s1 .f-title{ animation:rattle-text .35s linear .7s infinite; }
@media (prefers-reduced-motion: reduce){
  .finale .photo, .finale .say, .finale .f-title{ animation:none !important; }
}

.lyric{ min-height:30px; font-size:19px; font-weight:700; color:var(--grey700); text-align:center; }
.lyric span{ display:inline-block; animation:lyr .4s cubic-bezier(.3,1.6,.5,1); }
@keyframes lyr{ from{ transform:translateY(8px) scale(.9); opacity:0;} to{ transform:none; opacity:1;} }
.again{
  height:56px; width:min(86vw, 360px); border:0; border-radius:16px; background:var(--blue); color:#fff;
  font:inherit; font-size:17px; font-weight:700; cursor:pointer; opacity:0; pointer-events:none; transition:opacity .4s;
}
.again:active{ background:var(--blue-press); transform:scale(.98); }
.again:focus-visible{ outline:3px solid var(--grey900); outline-offset:3px; }
.finale.s5 .again{ opacity:1; pointer-events:auto; }

@media (prefers-reduced-motion: reduce){
  .shake,.shake-big{ animation:none; }
}
</style>
</head>
<body>
<div id="flash"></div>
<canvas id="fx"></canvas>

<div class="app" id="app">
  <div class="shapes" id="shapes" aria-hidden="true"><svg width="0" height="0" style="position:absolute"><filter id="wob" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence id="wobT" type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="1"/><feDisplacementMap in="SourceGraphic" scale="6" xChannelSelector="R" yChannelSelector="G"/></filter></svg></div>
  <main>
    <div class="bubble" id="bubble" aria-live="polite">
      <div class="pow" id="pow">2¹ = 2 · 니 눈 개수 👀</div>
      <div class="msg" id="msg">버튼 누르면 재밌는 일 생김 ㅋㅋ</div>
    </div>
    <div class="board" aria-hidden="true"><canvas id="board"></canvas></div>
    <div class="btnwrap" id="wrap">
      <button id="btn" aria-label="2의 1제곱"><span id="num">2<sup>1</sup></span></button>
    </div>
  </main>
</div>

  <div class="f-sub">2의 10제곱 완성. 수고했다.</div>
  <h1 class="f-title" id="f-title">10.24는 사실<br>제 생일이랍니다~ 🎂</h1>

    if(reduce) return;
    shapes.forEach((el,i)=>{
      const r = +el.dataset.r, base = `rotate(${r}deg)`, amp = lv/MAX, dir = i%2 ? 1 : -1;
      const hop = lv>=6 ? `translateY(${-6 - lv*1.5}px) ` : '';
      el.animate([{transform:base},{transform:`${hop}rotate(${r + dir*(6 + lv*5)}deg) scale(${1 + amp*.35})`},{transform:base}],
        {duration:420 + lv*25, delay:i*(lv>=8?10:22), easing:'cubic-bezier(.3,1.6,.5,1)'});
    });
  }

  function restart(el, cls){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
  function render(){
    num.innerHTML = '2<sup>' + n + '</sup>'; btn.setAttribute('aria-label', '2의 ' + n + '제곱');
    pow.textContent = FACT[n]; msg.textContent = MSG[n];
    btn.classList.toggle('glow', n >= 9 && n < MAX && !reduce);
  }

  /* ---------- audio ---------- */
  let ac = null, songEnd = 0, lyricTimers = [];
  function initAudio(){ if(!ac){ try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(ac && ac.state==='suspended') ac.resume(); }
  function note(f,t,dur,type,vol){
    if(!ac) return; const o=ac.createOscillator(), g=ac.createGain();
    o.type=type||'triangle'; o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol||.15,t+.015); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur+.05);
  }
  function clickSound(lv){
    if(!ac) return; const t=ac.currentTime, b=261.63*Math.pow(2,(lv-1)/4.5);
    note(b,t,.13,'sine',.14); if(lv>=3) note(b*1.5,t+.05,.15,'triangle',.1);
    if(lv>=5) note(b*2,t+.1,.2,'triangle',.1); if(lv>=8) note(b*3,t+.15,.26,'sine',.09);
  }
  function boom(){
    if(!ac) return; const len=ac.sampleRate*.5, buf=ac.createBuffer(1,len,ac.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
    const s=ac.createBufferSource(), f=ac.createBiquadFilter(), g=ac.createGain();
    s.buffer=buf; f.type='lowpass'; f.frequency.value=800+Math.random()*900; g.gain.value=.3;
    s.connect(f).connect(g).connect(ac.destination); s.start();
  }
  /* ---------- cartoon sfx ---------- */
  function sweep(type,f0,f1,dur,vol,t0){
    if(!ac) return null; const t=ac.currentTime+(t0||0), o=ac.createOscillator(), g=ac.createGain();
    o.type=type; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f1,t+dur);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.02); g.gain.setValueAtTime(vol,t+dur*.75); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur+.05); o._t=t; o._d=dur; return o;
  }
  function vib(o,rate,depth){
    if(!o) return; const l=ac.createOscillator(), lg=ac.createGain();
    l.frequency.value=rate; lg.gain.value=depth; l.connect(lg).connect(o.frequency); l.start(o._t); l.stop(o._t+o._d+.05);
  }
  function noiseHit(t0,dur,freq,type,vol){
    if(!ac) return; const t=ac.currentTime+t0, len=Math.floor(ac.sampleRate*dur), b=ac.createBuffer(1,len,ac.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
    const s=ac.createBufferSource(), f=ac.createBiquadFilter(), g=ac.createGain();
    s.buffer=b; f.type=type; f.frequency.value=freq; g.gain.value=vol; s.connect(f).connect(g).connect(ac.destination); s.start(t);
  }
  const SFX = {
    // 두둥탁
    dudung(){
      if(!ac) return; const t=ac.currentTime;
      [0,.2].forEach(d=>{ const o=ac.createOscillator(), g=ac.createGain(); o.type='sine';
        o.frequency.setValueAtTime(160,t+d); o.frequency.exponentialRampToValueAtTime(48,t+d+.28);
        g.gain.setValueAtTime(.7,t+d); g.gain.exponentialRampToValueAtTime(.001,t+d+.32);
        o.connect(g).connect(ac.destination); o.start(t+d); o.stop(t+d+.36); });
      noiseHit(.46,.16,1800,'highpass',.45);
    },
    // 띄용~ (스프링)
    boing(){ vib(sweep('sine',120,380,.6,.32),16,70); },
    // 휘익~? (슬라이드 휘슬 올라감 + 뿅?)
    whistle(){ vib(sweep('sine',450,1500,.6,.2),7,30); sweep('square',900,1400,.12,.06,.68); },
    // 빵빵! 빱! (광대 효르나 삼분 + 삿소리)
    honk(){
      [0,.26].forEach(d=>{ sweep('sawtooth',270,235,.2,.14,d); sweep('square',272,238,.2,.06,d); });
      vib(sweep('sine',1700,2600,.14,.13,.6),30,200);
    }
  };

  const SONG=[[392,.75],[392,.25],[440,1],[392,1],[523.25,1],[493.88,2],
    [392,.75],[392,.25],[440,1],[392,1],[587.33,1],[523.25,2],
    [392,.75],[392,.25],[783.99,1],[659.25,1],[523.25,1],[493.88,1],[440,2],
    [698.46,.75],[698.46,.25],[659.25,1],[523.25,1],[587.33,1],[523.25,3]];
  const LYRICS=[[0,'🎵 생일 축하합니다. (박수 쳐라)'],[6,'🎵 생일 축하합니다! (더 크게)'],[12,'🎵 사랑하는 보봇의~ (나다)'],[19,'🎵 생일 축하합니다!!! (선물은?)']];
  function playSong(onEnd){
    lyricTimers.forEach(clearTimeout); lyricTimers=[];
    const beat=.42, starts=[]; let acc=0; SONG.forEach(([,d])=>{ starts.push(acc); acc+=d*beat; });
    if(ac){ let t=ac.currentTime+.1; SONG.forEach(([f,d])=>{ note(f,t,d*beat*.95,'triangle',.2); note(f/2,t,d*beat*.9,'sine',.06); t+=d*beat; }); songEnd=t; }
    LYRICS.forEach(([i,txt])=> lyricTimers.push(setTimeout(()=>{ lyric.innerHTML='<span>'+txt+'</span>'; }, 100 + starts[i]*1000)));
    lyricTimers.push(setTimeout(()=>{ onEnd && onEnd(); }, 100 + acc*1000));
  }

  /* ---------- particles ---------- */
  const cv=$('fx'), ctx=cv.getContext('2d'); let W,H;
  function resize(){ const dpr=Math.min(2,devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
  resize(); addEventListener('resize', resize);
  const P=[]; let raf=null;
  function add(p){ P.push(Object.assign({g:.12,drag:.97,rot:0,vr:0,life:70,fade:25,size:6,shape:'dot'},p)); if(!raf) raf=requestAnimationFrame(loop); }
  function star(r){ ctx.beginPath(); for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2, rr=i%2?r*.45:r; ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);} ctx.closePath(); ctx.fill(); }
  function loop(){
    ctx.clearRect(0,0,W,H);
    for(let i=P.length-1;i>=0;i--){
      const p=P[i]; p.vx*=p.drag; p.vy=p.vy*p.drag+p.g; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.life--;
      if(p.life<=0 || p.y>H+80){ P.splice(i,1); continue; }
      ctx.globalAlpha=Math.min(1,p.life/p.fade); ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.c;
      if(p.shape==='rect') ctx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);
      else if(p.shape==='star') star(p.size);
      else if(p.shape==='emoji'){ ctx.font=p.size+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(p.e,0,0); }
      else { ctx.beginPath(); ctx.arc(0,0,p.size/2,0,Math.PI*2); ctx.fill(); }
      ctx.restore();
    }
    ctx.globalAlpha=1; raf=P.length?requestAnimationFrame(loop):null; if(!P.length) ctx.clearRect(0,0,W,H);
  }
  function burst(x,y,count,spd,shp){ for(let i=0;i<count;i++){ const a=rnd(0,Math.PI*2), s=spd*rnd(.4,1); add({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,c:pick(C),shape:pick(shp),size:rnd(6,12),vr:rnd(-.3,.3),life:rnd(45,80)}); } }
  function confetti(k){ for(let i=0;i<k;i++) add({x:rnd(0,W),y:rnd(-60,-10),vx:rnd(-2,2),vy:rnd(2,5),g:.05,drag:.99,c:pick(C),shape:'rect',size:rnd(10,15),vr:rnd(-.2,.2),life:220,fade:40}); }
  function firework(){
    const x=rnd(W*.15,W*.85), y=rnd(H*.12,H*.42), pal=[pick(C),pick(C),'#FFFFFF'];
    for(let i=0;i<70;i++){ const a=i/70*Math.PI*2, s=rnd(3,6.5); add({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:.06,drag:.965,c:pick(pal),size:rnd(4,7),life:rnd(55,85),fade:35}); }
    boom();
  }
  let fwTimer=null, cakeTimer=null;
  function fireworksShow(ms){ clearInterval(fwTimer); firework(); const end=Date.now()+ms; fwTimer=setInterval(()=>{ if(Date.now()>end) return clearInterval(fwTimer); firework(); if(Math.random()<.5) firework(); }, reduce?700:300); }
  function cakeRain(ms){
    clearInterval(cakeTimer); const end=Date.now()+ms, E=['🎂','🎂','🎂','🍰','🧁'];
    const drop=k=>{ for(let i=0;i<k;i++) add({shape:'emoji',e:pick(E),x:rnd(-10,W+10),y:rnd(-120,-30),vx:rnd(-.6,.6),vy:rnd(1,4),g:rnd(.12,.22),drag:.995,size:rnd(30,58),rot:rnd(-.5,.5),vr:rnd(-.05,.05),life:400,fade:10}); };
    drop(reduce?6:22);
    cakeTimer=setInterval(()=>{ if(Date.now()>end) return clearInterval(cakeTimer); drop(reduce?2:6); }, 120);
  }

  /* ---------- board: 보봇 분열 + 칸 쪼개기 ---------- */
  const BC = ['#F26B4F','#FFC23D','#8DB58A','#9CC2EE','#3182F6','#FFB8A3','#F4EFE6'];
  const bc = $('board'), bx = bc.getContext('2d'); let BW = 0;
  function build(level){
    let rs = [{x:0,y:0,w:1,h:1,c:1}];
    for(let i=0;i<level;i++){
      rs = rs.flatMap((r,j)=> r.w >= r.h - 1e-9
        ? [{x:r.x,y:r.y,w:r.w/2,h:r.h,c:r.c},{x:r.x+r.w/2,y:r.y,w:r.w/2,h:r.h,c:(r.c+2+i+j)%BC.length}]
        : [{x:r.x,y:r.y,w:r.w,h:r.h/2,c:r.c},{x:r.x,y:r.y+r.h/2,w:r.w,h:r.h/2,c:(r.c+3+i+j)%BC.length}]);
    }
    return rs;
  }
  let cells = build(1), prevCells = null, splitT0 = 0, crumble = null;
  function sizeBoard(){ const r = bc.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio||1); BW = r.width; bc.width = BW*dpr; bc.height = BW*dpr; bx.setTransform(dpr,0,0,dpr,0,0); }
  sizeBoard(); addEventListener('resize', sizeBoard);
  function rrect(x,y,w,h,r){ r = Math.max(0, Math.min(r, w/2, h/2)); bx.beginPath(); bx.moveTo(x+r,y); bx.arcTo(x+w,y,x+w,y+h,r); bx.arcTo(x+w,y+h,x,y+h,r); bx.arcTo(x,y+h,x,y,r); bx.arcTo(x,y,x+w,y,r); bx.closePath(); }
  function blob(cx,cy,w,h,col,i,t,rot,sq){
    const m = Math.min(w,h), pad = Math.max(.6, m*.06), sz = m-2*pad, rx = sz/2, ry = sz/2;
    const bob = reduce ? 0 : Math.sin(t*4 + i*1.7) * m * .03;
    bx.save(); bx.translate(cx, cy + bob); if(rot) bx.rotate(rot); if(sq) bx.scale(sq[0], sq[1]);
    const bs = reduce ? 0 : Math.floor(t*5) % 3, lw = Math.max(1, m*.028);
    const wob = (N, rx2, ry2, ox, oy, base, amp) => {
      const pts = [];
      for(let k=0;k<N;k++){ const a = k/N*Math.PI*2, s = Math.sin((k+1)*12.9898 + i*78.233 + bs*37.719)*43758.5453, jr = (s - Math.floor(s))*2 - 1, f = base(a) + amp*jr; pts.push([ox + Math.cos(a)*rx2*f, oy + Math.sin(a)*ry2*f]); }
      bx.beginPath();
      for(let k=0;k<=N;k++){ const p = pts[k%N], q = pts[(k+1)%N], mx = (p[0]+q[0])/2, my = (p[1]+q[1])/2; if(k===0) bx.moveTo(mx,my); else bx.quadraticCurveTo(p[0],p[1],mx,my); }
      bx.closePath();
    };
    const whiteBase = a => .87 + .13*Math.sin(a*3 + i*2.3)*Math.cos(a*2 + i);
    const yr = Math.min(rx, ry)*.52, yx = -rx*.04, yy = -ry*.04;
    if(m < 8){
      bx.fillStyle = '#FFF8EA'; bx.beginPath(); bx.ellipse(0, 0, rx, ry, 0, 0, 7); bx.fill();
      bx.fillStyle = '#FFB31F'; bx.beginPath(); bx.arc(yx, yy, yr, 0, 7); bx.fill();
    } else {
      // 흰자: 손그림 울통불통 + 살짝 어긋난 외곽선
      bx.lineJoin = 'round'; bx.lineCap = 'round';
      bx.fillStyle = '#FFF8EA'; wob(11, rx, ry, 0, 0, whiteBase, .035); bx.fill();
      bx.strokeStyle = '#F26B4F'; bx.lineWidth = lw; wob(11, rx, ry, m*.05, -m*.04, whiteBase, .05); bx.stroke();
      // 노른자: 울통불통 + 잌크 외곽선
      bx.fillStyle = '#FFB31F'; wob(8, yr, yr, yx, yy, ()=>1, .05); bx.fill();
      bx.strokeStyle = '#2A1A0A'; bx.lineWidth = lw*.8; wob(8, yr, yr, yx + m*.03, yy - m*.025, ()=>1, .07); bx.stroke();
      // 큰 후라이는 반짝 낙서
      if(m > 60){
        bx.strokeStyle = '#F4EFE6'; bx.lineWidth = lw; const sx = rx*.78, sy = -ry*.82, L = m*.07;
        [[-.9,-.3],[0,-1],[.9,-.3]].forEach(([dx,dy],k)=>{ const wig = bs*.02*(k-1); bx.beginPath(); bx.moveTo(sx + dx*L*.5, sy + dy*L*.5); bx.lineTo(sx + dx*L*(1.2+wig), sy + dy*L*(1.2-wig)); bx.stroke(); });
      }
    }
    if(m > 16){ bx.fillStyle = 'rgba(255,255,255,.75)'; bx.beginPath(); bx.arc(yx - yr*.45, yy - yr*.48, yr*.17, 0, 7); bx.fill(); }
    if(m > 14){
      const er = Math.max(.9, yr*.13), ex = yr*.36, ey = yy + yr*.02;
      const blink = !reduce && ((t + i*.37) % 4.2) < .13;
      bx.fillStyle = '#2A1A0A';
      if(blink){ bx.fillRect(yx-ex-er, ey-er*.25, er*2, er*.5); bx.fillRect(yx+ex-er, ey-er*.25, er*2, er*.5); }
      else { bx.beginPath(); bx.arc(yx-ex, ey, er, 0, 7); bx.arc(yx+ex, ey, er, 0, 7); bx.fill();
        if(m > 40){ bx.fillStyle = '#fff'; bx.beginPath(); bx.arc(yx-ex+er*.35, ey-er*.35, er*.35, 0, 7); bx.arc(yx+ex+er*.35, ey-er*.35, er*.35, 0, 7); bx.fill(); } }
      if(m > 34){
        bx.strokeStyle = '#2A1A0A'; bx.lineWidth = Math.max(1.2, yr*.07); bx.lineCap = 'round';
        bx.beginPath(); bx.arc(yx, ey + yr*.22, yr*.15, .15*Math.PI, .85*Math.PI); bx.stroke();
        bx.fillStyle = 'rgba(235,80,50,.45)'; bx.beginPath(); bx.arc(yx - ex*1.6, ey + yr*.3, yr*.12, 0, 7); bx.arc(yx + ex*1.6, ey + yr*.3, yr*.12, 0, 7); bx.fill();
      }
    }
    bx.restore();
  }
  const ease = x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2); };
  function drawBoard(now){
    const t = now/1000; bx.clearRect(0,0,BW,BW);
    if(crumble){
      const e = (now - crumble.t0)/1000;
      bx.save(); bx.globalAlpha = Math.min(1, e*1.5); bx.textAlign = 'center'; bx.textBaseline = 'middle';
      bx.font = '700 ' + Math.round(BW*.3) + 'px Fredoka, sans-serif'; bx.fillStyle = '#1A4FAE'; bx.fillText('10.24', BW/2, BW/2 + BW*.02);
      bx.fillStyle = '#FFC23D'; bx.fillText('10.24', BW/2, BW/2 - BW*.01); bx.restore();
      crumble.parts.forEach((p,i)=>{
        const d = Math.max(0, e - p.delay); const y = p.y + p.vy*d*BW + .5*2.6*BW*d*d, x = p.x + p.vx*d*BW;
        if(y - p.h > BW + 40) return; blob(x, y, p.w, p.h, p.c, i, t, p.vr*d, null);
      });
      return;
    }
    const k = prevCells ? Math.min(1, (now - splitT0)/450) : 1;
    const e = ease(k);
    cells.forEach((r,i)=>{
      let x = r.x, y = r.y, w = r.w, h = r.h;
      if(prevCells && k < 1){ const p = prevCells[i>>1]; x = p.x + (r.x-p.x)*e; y = p.y + (r.y-p.y)*e; w = p.w + (r.w-p.w)*e; h = p.h + (r.h-p.h)*e; }
      const sq = (prevCells && k < 1) ? [1 + .12*Math.sin(k*Math.PI), 1 - .12*Math.sin(k*Math.PI)] : null;
      blob((x + w/2)*BW, (y + h/2)*BW, w*BW, h*BW, BC[r.c], i, t, 0, sq);
    });
    if(k >= 1) prevCells = null;
  }
  (function boardLoop(now){ if(!document.hidden) drawBoard(now); requestAnimationFrame(boardLoop); })(performance.now());
  function splitTo(level){ prevCells = cells; cells = build(level); splitT0 = performance.now(); }
  function crumbleBoard(){
    crumble = { t0: performance.now(), parts: cells.map(r=>({ x:(r.x+r.w/2)*BW, y:(r.y+r.h/2)*BW, w:r.w*BW, h:r.h*BW, c:BC[r.c],
      vx: rnd(-.25,.25), vy: rnd(-.6,-.1), vr: rnd(-6,6), delay: (1 - r.y)*.35 + Math.random()*.25 })) };
    noiseHit(0, 1.3, 260, 'lowpass', .7);
  }

  /* ---------- level effects ---------- */
  function center(){ const r=btn.getBoundingClientRect(); return [r.left+r.width/2, r.top+r.height/2]; }
  function ring(delay){ setTimeout(()=>{ const d=document.createElement('div'); d.className='ring'; wrap.appendChild(d); d.addEventListener('animationend',()=>d.remove()); }, delay); }
  function floaties(k){
    for(let i=0;i<k;i++){
      const keys=['clover','flower','burst','dot','squircle'], s=document.createElementNS('http://www.w3.org/2000/svg','svg');
      s.setAttribute('viewBox','0 0 100 100'); s.classList.add('floaty'); const sz=rnd(18,30); s.style.width=sz+'px'; s.style.height=sz+'px';
      s.innerHTML=SH[pick(keys)](pick(C));
      s.style.setProperty('--dx',rnd(-150,150)+'px'); s.style.setProperty('--dy',rnd(-190,-60)+'px'); s.style.setProperty('--r',rnd(-120,120)+'deg');
      wrap.appendChild(s); s.addEventListener('animationend',()=>s.remove());
    }
  }
  function fx(lv){
    restart(btn,'squish'); restart(btn,'pop'); restart(bubble,'wiggle'); clickSound(lv); shapesReact(lv);
    const [x,y]=center(), m=reduce?.4:1;
    if(lv>=2) ring(0);
    if(lv>=6) ring(140);
    if(lv>=3) burst(x,y,Math.round(lv*6*m),3+lv*.6, lv>=7?['dot','star','rect']:['dot']);
    if(lv>=5) floaties(Math.round((lv-3)*2*m));
    if(lv>=6){ flashEl.style.background=pick(C); restart(flashEl,'go'); }
    if(lv>=7 && !reduce) restart(app, lv>=9?'shake-big':'shake');
    if(lv>=8) confetti(Math.round(40*m));
  }

  function finaleShow(){
    busy = true;
    fireworksShow(2200);
    setTimeout(()=>{ cakeRain(6500); }, 500);
    const step=(cls,ms,sfx)=>setTimeout(()=>{ finale.classList.add(cls); if(sfx) sfx(); }, ms);
    setTimeout(()=>finale.classList.add('show'), 1300);
    step('s1', 1500, SFX.dudung);
    step('s2', 2900, SFX.boing);
    step('s3', 4700, SFX.whistle);
    step('s4', 6400, SFX.honk);
    setTimeout(()=>{ playSong(()=>{ finale.classList.add('s5'); $('again').focus(); }); }, 7600);
  }

  btn.addEventListener('click', ()=>{
    initAudio();
    if(busy || n >= MAX) return;
    n++; render(); fx(n); splitTo(n);
    if(n === MAX){ busy = true; setTimeout(crumbleBoard, 1100); setTimeout(finaleShow, 2600); }
  });
  $('again').addEventListener('click', ()=>{
    finale.className='finale'; lyric.textContent=''; n=1; busy=false;
    clearInterval(fwTimer); clearInterval(cakeTimer); lyricTimers.forEach(clearTimeout);
    crumble = null; prevCells = null; cells = build(1);
    render(); btn.focus();
  });
  render();
})();
</script>
